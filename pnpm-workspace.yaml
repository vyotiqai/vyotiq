# pnpm 11 security defaults (explicit so global ~/.config/pnpm/rc cannot drift).
minimumReleaseAge: 1440
nodeLinker: isolated

packages:
  - landing

allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  node-llama-cpp: true

peerDependencyRules:
  allowedVersions:
    eslint: '10'
    react: '19'

# @astrojs/check still needs the TypeScript 6 language-service API; the app stays on 7.
packageExtensions:
  '@astrojs/check':
    dependencies:
      typescript: 6.0.3

overrides:
  '@sentry/core': 10.67.0
  adm-zip: '>=0.6.0'
  sharp: '>=0.35.3'
  nanoid: '>=3.3.18'

minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.11.0'
  - '@astrojs/markdown-satteri@0.4.0'
  - '@astrojs/sitemap@3.7.4'
  - astro@7.2.10
