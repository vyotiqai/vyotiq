appId: com.vyotiq.agent
productName: Vyotiq
icon: resources/icon.png
directories:
  buildResources: build
  output: dist-package
asar: true
compression: maximum
files:
  - 'NOTICE'
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/**'
  - '!docs/**'
  - '!landing/**'
  - '!dist-package*/**'
  - '!resources/harness/proposals/**'
  - '!resources/branding/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.{md,map}'
  # onnxruntime natives are trimmed per target OS (see win/mac/linux.files).
  # Grammars ship via extraResources/codeindex/wasm; skip full package (~49 MB).
  - '!**/tree-sitter-wasms/**'
extraResources:
  - from: resources/harness
    to: harness
    filter:
      - '**/*'
      - '!proposals/**'
  - from: resources/marketplace
    to: marketplace
  - from: resources/codeindex/wasm
    to: codeindex/wasm
asarUnpack:
  - resources/**
  # pnpm isolated linker nests packages under .pnpm; unpack both top-level and nested.
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/@huggingface/transformers/**'
win:
  icon: resources/icon.ico
  target:
    - nsis
  # Win x64 only — drop other onnxruntime natives (~150 MB). macOS/Linux keep theirs.
  files:
    - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  executableName: Vyotiq
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  deleteAppDataOnUninstall: false
  runAfterFinish: true
mac:
  target:
    - dmg
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  category: public.app-category.developer-tools
  extendInfo:
    NSMicrophoneUsageDescription: Vyotiq uses the microphone for voice dictation.
  notarize: false
  files:
    - '!**/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/onnxruntime-node/bin/napi-v6/win32/**'
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: vyotiq.com
  category: Development
  files:
    - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/onnxruntime-node/bin/napi-v6/win32/**'
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false

publish:
  provider: github
  owner: vyotiqai
  repo: vyotiq-agent-v
  releaseType: release
