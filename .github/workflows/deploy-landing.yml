# Deploys the landing site to Cloudflare Pages on every main push that touches it.
# Required repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  — token with Cloudflare Pages: Edit permission
#   CLOUDFLARE_ACCOUNT_ID — the Pages account id
name: Deploy landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'scripts/sync-landing-brand.mjs'
      - 'scripts/sync-app-icon.mjs'
      - 'scripts/generate-precision-mono-brand.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing site
        run: pnpm landing:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        # Deployed via the wrangler CLI instead of cloudflare/wrangler-action:
        # this repo's Actions policy only allows GitHub-owned actions, so the
        # official action (a third-party action) cannot start here.
        run: pnpm dlx wrangler@4 pages deploy landing/dist --project-name=vyotiq --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
