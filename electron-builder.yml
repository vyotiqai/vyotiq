appId: com.vyotiq.agent
productName: Vyotiq
icon: resources/icon.png
directories:
  buildResources: build
  output: dist-package
asar: true
compression: maximum
files:
  - 'NOTICE'
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/**'
  - '!docs/**'
  - '!landing/**'
  - '!dist-package*/**'
  - '!resources/harness/proposals/**'
  - '!resources/branding/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.{md,map}'
  # onnxruntime natives are trimmed per target OS (see win/mac/linux.files).
  # Grammars ship via extraResources/codeindex/wasm; skip full package (~49 MB).
  - '!**/tree-sitter-wasms/**'
  # Drop dev-only weight from asar-packed node_modules (never loaded at runtime).
  - '!**/node_modules/**/{test,tests,__tests__,doc,docs,examples}/**'
  - '!**/node_modules/**/*.md'
  - '!**/node_modules/**/*.map'
extraResources:
  - from: resources/harness
    to: harness
    filter:
      - '**/*'
      - '!proposals/**'
  - from: resources/marketplace
    to: marketplace
  - from: resources/codeindex/wasm
    to: codeindex/wasm
asarUnpack:
  - resources/**
  # Native addons cannot load from asar. Unpack .node files and ORT shared libs
  # (dll/so/dylib sit beside the binding). pnpm nests under .pnpm — use ** globs.
  # Do not unpack @huggingface/transformers (JS/WASM only; no .node).
  - '**/*.node'
  - '**/node_modules/onnxruntime-node/bin/**'
win:
  icon: resources/icon.ico
  target:
    - nsis
  # publisherName enables NSIS updater signature verification: electron-updater
  # compares the downloaded installer's Authenticode subject against it and
  # throws ERR_UPDATER_INVALID_SIGNATURE when they do not match. It MUST stay
  # unset while release builds are unsigned (release.yml falls back to unsigned
  # packs when CSC_LINK is unset) or Windows auto-update always fails. Re-add
  # `publisherName: <cert subject CN>` together with win.forceCodeSigning: true
  # once the signing cert is always present in the release environment.
  # Win x64 only — drop other onnxruntime natives (~150 MB). macOS/Linux keep theirs.
  files:
    - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  executableName: Vyotiq
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  deleteAppDataOnUninstall: false
  runAfterFinish: true
mac:
  icon: resources/icon.icns
  target:
    - dmg
    - zip
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  category: public.app-category.developer-tools
  extendInfo:
    NSMicrophoneUsageDescription: Vyotiq uses the microphone for voice dictation.
  notarize: false
  files:
    - '!**/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/onnxruntime-node/bin/napi-v6/win32/**'
dmg:
  # ${arch} keeps arm64/x64 DMGs from colliding: both are uploaded to the same
  # GitHub release by the single macOS job in release.yml, and latest-mac.yml
  # must reference distinct files per arch (MacUpdater picks by URL).
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  maintainer: vyotiq.com
  category: Development
  files:
    - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/onnxruntime-node/bin/napi-v6/win32/**'
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false

publish:
  provider: github
  owner: vyotiqai
  repo: vyotiq-agent-v
  releaseType: release
